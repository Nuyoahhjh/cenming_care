workflows:
  ios-ipa:
    name: iOS IPA (unsigned)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      flutter: 3.35.4
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "top.myguntop.cenmingCare"
    scripts:
      - name: Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd "$CM_BUILD_DIR/ios"
          pod install
      - name: Analyze
        script: |
          flutter analyze
      - name: Build unsigned iOS app
        script: |
          flutter build ios --release --no-codesign \
            --build-name=1.0.3 \
            --build-number=$PROJECT_BUILD_NUMBER
      - name: Package unsigned IPA
        script: |
          set -e
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Runner.app not found"
            exit 1
          fi
          rm -rf build/ios/ipa
          mkdir -p build/ios/ipa/Payload
          cp -R "$APP_PATH" build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -qry "cenming-care-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/iphoneos/Runner.app
