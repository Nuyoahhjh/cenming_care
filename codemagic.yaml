workflows:
  android-apk:
    name: Android APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: 3.35.4
      java: 17
      android_signing:
        - cenming_keystore
      vars:
        PACKAGE_NAME: "top.myguntop.cenming_care"
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Analyze
        script: |
          flutter analyze
      - name: Build release APK
        script: |
          flutter build apk --release \
            --build-name=1.0.3 \
            --build-number=$PROJECT_BUILD_NUMBER
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/flutter-apk/app-release.apk.sha1
    publishing:
      email:
        recipients:
          - 2717564110@qq.com
        notify:
          success: true
          failure: true

  ios-ipa:
    name: iOS IPA
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_app_store_connect
    environment:
      flutter: 3.35.4
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: top.myguntop.cenmingCare
      vars:
        BUNDLE_ID: "top.myguntop.cenmingCare"
    scripts:
      - name: Set iOS bundle identifier
        script: |
          cd "$CM_BUILD_DIR/ios"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" \
            Runner/Info.plist 2>/dev/null || true
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/" \
            Runner.xcodeproj/project.pbxproj
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install CocoaPods
        script: |
          cd "$CM_BUILD_DIR/ios"
          pod install
      - name: Analyze
        script: |
          flutter analyze
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-name=1.0.3 \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/ipa/*.app.dSYM.zip
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
      email:
        recipients:
          - 2717564110@qq.com
        notify:
          success: true
          failure: true
